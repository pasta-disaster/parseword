[package]
name = "parseword"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { version = "0.6.0", features = ["alloc", "rand_core"] }
aes-gcm = "0.11"
rand = "0.8"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1.1", features = ["use-std"] }

[dev-dependencies]
tempfile = "3.27.0"
